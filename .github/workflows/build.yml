name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The daemon JVM is pinned to Java 25 in gradle/gradle-daemon-jvm.properties.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # ubuntu-latest already ships the Android SDK; the setup-android action is not used
      # because it still asks sdkmanager for a package called "tools" that no longer exists.
      - name: Install SDK packages
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          # The runner image keeps cmdline-tools in a versioned folder and does not put
          # sdkmanager on PATH, so find it explicitly.
          SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKM" ]; then echo "sdkmanager not found under $SDK"; exit 1; fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" || true
          "$SDKM" "build-tools;36.0.0" || true
          "$SDKM" "platforms;android-37" || echo "platform 37 not offered by the repository yet"

      # The executable bit does not survive a Windows checkout, so set it here.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build debug APKs
        run: ./gradlew assembleDebug --console=plain

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
