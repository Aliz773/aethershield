name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install SDK packages
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          # The runner image keeps cmdline-tools in a versioned folder and does not put
          # sdkmanager on PATH, so find it explicitly.
          SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKM" ]; then echo "sdkmanager not found under $SDK"; exit 1; fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" || true
          "$SDKM" "build-tools;36.0.0" || true
          "$SDKM" "platforms;android-37" || echo "platform 37 not offered by the repository yet"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      # The keystore lives base64-encoded in a repository secret, is written to the runner's
      # temp dir, used, and removed at the end. Secrets are never referenced from an "if"
      # condition (GitHub does not allow that) and never printed.
      - name: Stage the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AETHER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AETHER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AETHER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AETHER_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No signing key configured; the release build will stay unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aether.jks"
          {
            echo "AETHER_KEYSTORE_PATH=$RUNNER_TEMP/aether.jks"
            echo "AETHER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "AETHER_KEY_ALIAS=$KEY_ALIAS"
            echo "AETHER_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Signing key staged for this run."

      - name: Build release APKs
        run: ./gradlew assembleRelease --console=plain

      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          version="${{ github.event.release.tag_name }}"
          [ -z "$version" ] && version="dev"
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk)
            cp "$f" "dist/AetherShield-${version}-${base}.apk"
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Upload to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Keep the APKs as workflow artifacts too
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*
          if-no-files-found: error

      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/aether.jks"
