name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install SDK packages
        run: |
          set -e
          sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      # The keystore lives base64-encoded in a repository secret, is written to the runner's
      # temp dir, used, and removed at the end. It is never printed and never committed.
      - name: Decode signing key
        if: ${{ secrets.AETHER_KEYSTORE_BASE64 != '' }}
        run: |
          set -e
          echo "${{ secrets.AETHER_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/aether.jks"
          echo "AETHER_KEYSTORE_PATH=$RUNNER_TEMP/aether.jks" >> "$GITHUB_ENV"
          echo "AETHER_KEYSTORE_PASSWORD=${{ secrets.AETHER_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "AETHER_KEY_ALIAS=${{ secrets.AETHER_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "AETHER_KEY_PASSWORD=${{ secrets.AETHER_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APKs
        run: ./gradlew assembleRelease --console=plain

      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          version="${{ github.event.release.tag_name }}"
          [ -z "$version" ] && version="dev"
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f" .apk)
            cp "$f" "dist/AetherShield-${version}-${base}.apk"
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Upload to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Keep the APKs as workflow artifacts too
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*
          if-no-files-found: error

      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/aether.jks"
